<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" type="text/css" href="css"
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Ultrakill - Assistente IA</title>
   
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const apiProviderSelect = document.getElementById("apiProvider");
        const apiKeyInput = document.getElementById("apiKey");
        const apiInfo = document.getElementById("apiInfo");
        const saveApiKeyBtn = document.getElementById("saveApiKey");
        const messageInput = document.getElementById("messageInput");
        const sendMessageBtn = document.getElementById("sendMessage");
        const chatBox = document.getElementById("chatBox");

        let apiKey = "";
        let apiProvider = "gemini";
        let isProcessing = false;

        apiProviderSelect.addEventListener("change", function () {
          apiProvider = this.value;
          updateApiInfo();
        });

        function updateApiInfo() {
          if (apiProvider === "gemini") {
            apiInfo.innerHTML =
              'Para Google Gemini: Obtenha uma chave gratuita em <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>';
            apiKeyInput.placeholder = "Digite sua chave do Google Gemini...";
          } else {
            apiInfo.innerHTML =
              'Para DeepSeek: Obtenha uma chave em <a href="https://platform.deepseek.com/api_keys" target="_blank">DeepSeek Platform</a> (pode requerer pagamento)';
            apiKeyInput.placeholder = "Digite sua chave do DeepSeek...";
          }
        }

        updateApiInfo();

        saveApiKeyBtn.addEventListener("click", function () {
          apiKey = apiKeyInput.value.trim();

          if (!apiKey) {
            addMessage("Por favor, digite uma chave da API válida.", "warning");
            return;
          }

          apiKeyInput.type = "password";
          apiKeyInput.value = "••••••••••••••••";
          apiKeyInput.disabled = true;
          saveApiKeyBtn.disabled = true;
          apiProviderSelect.disabled = true;

          messageInput.disabled = false;
          sendMessageBtn.disabled = false;

          addMessage(
            `Chave da API ${
              apiProvider === "gemini" ? "Google Gemini" : "DeepSeek"
            } salva com sucesso! Agora você pode fazer suas perguntas sobre Ultrakill.`,
            "bot"
          );
          messageInput.focus();
        });

        sendMessageBtn.addEventListener("click", sendMessage);

        messageInput.addEventListener("keypress", function (e) {
          if (e.key === "Enter" && !isProcessing) {
            sendMessage();
          }
        });

        async function sendMessage() {
          const message = messageInput.value.trim();

          if (!message || isProcessing) return;

          if (!isUltrakillRelated(message)) {
            addMessage(
              "Por favor, faça apenas perguntas relacionadas a Ultrakill. Este assistente é especializado em Ultrakill.",
              "warning"
            );
            messageInput.value = "";
            return;
          }

          addMessage(message, "user");
          messageInput.value = "";

          showTypingIndicator();

          await processQuestion(message);
        }

        async function processQuestion(question) {
          isProcessing = true;
          sendMessageBtn.disabled = true;

          try {
            let response;

            if (apiProvider === "gemini") {
              response = await callGeminiAPI(question);
            } else {
              response = await callDeepSeekAPI(question);
            }

            removeTypingIndicator();
            addMessage(response, "bot");
          } catch (error) {
            console.error("Erro ao processar a pergunta:", error);
            removeTypingIndicator();

            let errorMessage =
              "Desculpe, ocorreu um erro ao processar sua pergunta. ";

            if (error.message.includes("402")) {
              errorMessage +=
                "A API selecionada requer pagamento. Por favor, use o Google Gemini que tem um plano gratuito.";
            } else if (error.message.includes("401")) {
              errorMessage +=
                "Chave da API inválida ou não autorizada. Verifique sua chave e tente novamente.";
            } else if (error.message.includes("429")) {
              errorMessage += "Limite de requisições excedido. Tente novamente mais tarde.";
            } else if (error.message.includes("500")) {
              errorMessage += "Erro interno do servidor. Tente novamente em alguns instantes.";
            } else {
              errorMessage += `Detalhes: ${error.message}`;
            }

            addMessage(errorMessage, "error");
          } finally {
            isProcessing = false;
            sendMessageBtn.disabled = false;
          }
        }

        async function callGeminiAPI(question) {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    {
                      text: `Você é um assistente especializado em Ultrakill. Responda apenas perguntas relacionadas a Ultrakill, incluindo gameplay, armas, inimigos, níveis, estratégias, lore, modos de jogo e conteúdo do Ultrakill. Se a pergunta não for sobre Ultrakill, explique educadamente que você só pode ajudar com questões relacionadas a Ultrakill.


Pergunta do usuário: ${question}`,
                    },
                  ],
                },
              ],
              generationConfig: {
                temperature: 0.7,
                maxOutputTokens: 1000,
              },
            }),
          });

          if (!response.ok) {
            throw new Error(`Erro na API: ${response.status} - ${response.statusText}`);
          }

          const data = await response.json();

          if (data.candidates && data.candidates.length > 0) {
            return data.candidates[0].content.parts[0].text;
          } else {
            throw new Error("Resposta da API não contém dados válidos");
          }
        }

        async function callDeepSeekAPI(question) {
          const response = await fetch(
            "https://api.deepseek.com/v1/chat/completions",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${apiKey}`,
              },
              body: JSON.stringify({
                model: "deepseek-chat",
                messages: [
                  {
                    role: "system",
                    content:
                      "Você é um assistente especializado em Ultrakill. Responda apenas perguntas relacionadas a Ultrakill, incluindo gameplay, armas, inimigos, níveis, estratégias, lore, modos de jogo e conteúdo do Ultrakill. Se a pergunta não for sobre Ultrakill, explique educadamente que você só pode ajudar com questões relacionadas a Ultrakill.",
                  },
                  {
                    role: "user",
                    content: question,
                  },
                ],
                max_tokens: 1000,
                temperature: 0.7,
              }),
            }
          );

          if (!response.ok) {
            throw new Error(
              `Erro na API: ${response.status} - ${response.statusText}`
            );
          }

          const data = await response.json();

          if (data.choices && data.choices.length > 0) {
            return data.choices[0].message.content;
          } else {
            throw new Error("Resposta da API não contém dados válidos");
          }
        }

        function isUltrakillRelated(message) {
          const ultrakillKeywords = [
            "ultrakill",
            "arma",
            "armas",
            "inimigo",
            "inimigos",
            "nível",
            "níveis",
            "boss",
            "chefão",
            "estratégia",
            "estratégias",
            "combo",
            "ponto de vida",
            "dano",
            "runas",
            "modos de jogo",
            "score",
            "velocidade",
            "mecânicas",
            "mapa",
            "trilha sonora",
            "lore",
            "história",
            "controladores",
            "plataformas",
            "gráficos",
            "desafios",
            "missões",
            "dificuldade",
            "gameplay",
          ];

          const lowerMessage = message.toLowerCase();
          return ultrakillKeywords.some((keyword) =>
            lowerMessage.includes(keyword.toLowerCase())
          );
        }

        function addMessage(text, sender) {
          const messageDiv = document.createElement("div");
          messageDiv.classList.add("message");

          if (sender === "user") {
            messageDiv.classList.add("user-message");
            messageDiv.textContent = text;
          } else if (sender === "bot") {
            messageDiv.classList.add("bot-message");
            const formattedText = formatCodeBlocks(text);
            messageDiv.innerHTML = formattedText;
          } else if (sender === "warning") {
            messageDiv.classList.add("warning-message");
            messageDiv.textContent = text;
          } else if (sender === "error") {
            messageDiv.classList.add("error-message");
            messageDiv.textContent = text;
          }

          chatBox.appendChild(messageDiv);
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        function formatCodeBlocks(text) {
          return text.replace(
            /``````/g,
            function (match, language, code) {
              return `<div class="code-block"><pre><code>${code.trim()}</code></pre></div>`;
            }
          );
        }

        function showTypingIndicator() {
          const typingDiv = document.createElement("div");
          typingDiv.classList.add("typing-indicator");
          typingDiv.id = "typingIndicator";

          const dotsDiv = document.createElement("div");
          dotsDiv.classList.add("typing-dots");

          for (let i = 0; i < 3; i++) {
            const dot = document.createElement("div");
            dot.classList.add("typing-dot");
            dotsDiv.appendChild(dot);
          }

          typingDiv.appendChild(dotsDiv);
          chatBox.appendChild(typingDiv);
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTypingIndicator() {
          const typingIndicator = document.getElementById("typingIndicator");
          if (typingIndicator) {
            typingIndicator.remove();
          }
        }
      });
    </script>
  </body>
</html>
